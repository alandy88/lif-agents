<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>LIF Capture</title>
    <style>
      /* Firefox paints the popup white unless the page names a background. */
      :root { color-scheme: light dark; }
      body { background: Canvas; color: CanvasText; font: 13px system-ui, sans-serif; margin: 10px; min-width: 240px; }
      #actions { display: flex; gap: 6px; }
      #actions button { flex: 1; padding: 6px 0; }
      #status { margin: 10px 0 0; overflow-wrap: anywhere; }
      #status:empty { display: none; }
    </style>
  </head>
  <body>
    <div id="actions">
      <button type="button" data-action="explain">Explain</button>
      <button type="button" data-action="note">Note</button>
    </div>
    <p id="status" role="status"></p>
    <script src="popup.js"></script>
  </body>
</html>
