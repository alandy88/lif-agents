<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LIF Hub</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #111214;
        --panel: #1a1b1e;
        --card: #202226;
        --line: #2e3035;
        --fg: #e6e6e6;
        --muted: #8b8f98;
        --accent: #4c8bf5;
        --accent-soft: rgba(76, 139, 245, 0.15);
        --danger: #e5484d;
        --ok: #3dd68c;
      }
      @media (prefers-color-scheme: light) {
        :root {
          color-scheme: light;
          --bg: #f5f6f8; --panel: #ffffff; --card: #f0f1f4; --line: #dcdee3;
          --fg: #1b1d21; --muted: #6b7079; --accent-soft: rgba(76, 139, 245, 0.12);
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 320px;
        grid-template-rows: 100%;
        font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
        color: var(--fg);
        background: var(--bg);
      }
      main {
        display: flex;
        flex-direction: column;
        min-width: 0;
        border-right: 1px solid var(--line);
      }
      aside {
        background: var(--panel);
        overflow-y: auto;
        padding: 16px;
      }
      h1 { font-size: 15px; margin: 0; font-weight: 600; }
      h2 { font-size: 12px; margin: 0 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 20px;
        border-bottom: 1px solid var(--line);
      }
      header .sub { color: var(--muted); font-size: 12px; }
      header .spacer { flex: 1; }
      .pill {
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 999px;
        border: 1px solid var(--line);
        color: var(--muted);
      }
      .pill.ok { color: var(--ok); border-color: var(--ok); }
      .pill.bad { color: var(--danger); border-color: var(--danger); }

      #thread {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .msg { max-width: 760px; }
      .msg.me { align-self: flex-end; }
      .bubble {
        padding: 10px 14px;
        border-radius: 12px;
        white-space: pre-wrap;
        word-break: break-word;
        background: var(--card);
        border: 1px solid var(--line);
      }
      .me .bubble { background: var(--accent); border-color: var(--accent); color: #fff; }
      .bubble.err { border-color: var(--danger); }
      .msg .meta { font-size: 11px; color: var(--muted); margin-top: 4px; }

      .route {
        border: 1px solid var(--accent);
        background: var(--accent-soft);
        border-radius: 12px;
        padding: 12px 14px;
        display: grid;
        gap: 10px;
      }
      .route .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
      .route label { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 3px; }
      select, input[type="text"] {
        padding: 6px 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        color: var(--fg);
        font: inherit;
        min-width: 140px;
      }
      details { font-size: 12px; }
      details summary { cursor: pointer; color: var(--muted); }
      details pre {
        max-height: 260px;
        overflow: auto;
        margin: 6px 0 0;
        padding: 10px;
        background: var(--panel);
        border-radius: 8px;
        font-size: 12px;
        white-space: pre-wrap;
      }
      button {
        padding: 7px 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--card);
        color: var(--fg);
        font: inherit;
        cursor: pointer;
      }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      button:disabled { opacity: 0.5; cursor: default; }

      form#compose {
        border-top: 1px solid var(--line);
        padding: 14px 20px 16px;
        display: grid;
        gap: 8px;
      }
      textarea {
        width: 100%;
        min-height: 88px;
        resize: vertical;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--panel);
        color: var(--fg);
        font: inherit;
      }
      .chips { display: flex; gap: 6px; flex-wrap: wrap; }
      .chip {
        padding: 3px 10px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--fg);
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }
      .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
      .compose-row { display: flex; gap: 8px; align-items: center; }
      .compose-row .spacer { flex: 1; }
      .hint { font-size: 11px; color: var(--muted); }

      .launch { padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); margin-bottom: 8px; cursor: pointer; }
      .launch:hover { border-color: var(--accent); }
      .launch.err { border-color: #c44; }
      .launch .title { font-weight: 600; font-size: 13px; }
      .launch .where { font-size: 12px; color: var(--muted); word-break: break-all; }
      .launch .tags { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
      .tag { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
      .empty { color: var(--muted); font-size: 13px; }
      .modes-help { display: grid; gap: 6px; font-size: 12px; margin-bottom: 18px; }
      .modes-help b { display: inline-block; min-width: 56px; }
      .modes-help .d { color: var(--muted); }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>LIF Hub</h1>
        <span class="sub">Say what you want. It picks a mode and a repo, then starts an agent in its own worktree.</span>
        <span class="spacer"></span>
        <span class="pill" id="health">checking…</span>
      </header>

      <div id="thread"></div>

      <form id="compose">
        <textarea id="text" placeholder="e.g. plan a Bicep module for the gateway's rate limiter   (Ctrl/Cmd+Enter to route)"></textarea>
        <div class="compose-row">
          <span class="chips" id="modes"><button type="button" class="chip on" data-mode="">auto</button></span>
          <select id="repo"><option value="">repo: auto</option></select>
          <span class="spacer"></span>
          <span class="hint" id="count"></span>
          <button type="submit" class="primary" id="go">Route</button>
        </div>
      </form>
    </main>

    <aside>
      <h2>Modes</h2>
      <div class="modes-help" id="modes-help"></div>
      <h2>Started</h2>
      <div id="launches"><div class="empty">Nothing yet.</div></div>
    </aside>

    <script>
      'use strict'
      var MAX_CHARS = 20000
      var state = { profiles: null, mode: '', busy: false, launches: [] }
      var $ = function (id) { return document.getElementById(id) }
      var thread = $('thread'), textEl = $('text'), goEl = $('go'), repoEl = $('repo'), countEl = $('count')

      function api(path, body) {
        var opts = body ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) } : {}
        return fetch(path, opts).then(function (r) {
          return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status)); return j })
        })
      }

      function el(tag, cls, text) {
        var e = document.createElement(tag)
        if (cls) e.className = cls
        if (text !== undefined) e.textContent = text
        return e
      }
      function post(node) { thread.appendChild(node); thread.scrollTop = thread.scrollHeight; return node }
      function say(text, who, err) {
        var m = el('div', 'msg ' + who)
        var b = el('div', 'bubble' + (err ? ' err' : ''), text)
        m.appendChild(b)
        return post(m)
      }
      function label(c) { return c.mode + (c.domain ? '/' + c.domain : '') + ' → ' + c.repo }

      function fillSelect(sel, items, current, blankLabel) {
        sel.innerHTML = ''
        if (blankLabel !== undefined) sel.appendChild(new Option(blankLabel, ''))
        items.forEach(function (v) { sel.appendChild(new Option(v, v)) })
        sel.value = current || ''
      }

      function routeCard(message, routed) {
        var card = el('div', 'msg')
        var box = el('div', 'route')
        var head = el('div', '', 'Routed: ' + label(routed.classification) + '   ·   worktree ' + routed.name)
        var row = el('div', 'row')

        var modeL = el('label', '', 'mode'), modeS = document.createElement('select')
        fillSelect(modeS, Object.keys(state.profiles.modes), routed.classification.mode)
        modeL.appendChild(modeS)
        var domL = el('label', '', 'domain'), domS = document.createElement('select')
        var refreshDomains = function () {
          fillSelect(domS, Object.keys(state.profiles.modes[modeS.value].domains), routed.classification.domain || '', 'none')
        }
        refreshDomains()
        modeS.addEventListener('change', function () { routed.classification.domain = null; refreshDomains() })
        domL.appendChild(domS)
        var repoL = el('label', '', 'repo'), repoS = document.createElement('select')
        fillSelect(repoS, state.profiles.repos.map(function (r) { return r.displayName }), routed.classification.repo)
        repoL.appendChild(repoS)
        row.appendChild(modeL); row.appendChild(domL); row.appendChild(repoL)

        var det = document.createElement('details')
        det.appendChild(el('summary', '', 'Show the prompt the agent will get'))
        det.appendChild(el('pre', '', routed.prompt))

        var actions = el('div', 'row')
        var start = el('button', 'primary', 'Start agent'), cancel = el('button', '', 'Discard')
        actions.appendChild(start); actions.appendChild(cancel)

        box.appendChild(head); box.appendChild(row); box.appendChild(det); box.appendChild(actions)
        card.appendChild(box)

        cancel.addEventListener('click', function () { card.remove() })
        start.addEventListener('click', function () {
          start.disabled = cancel.disabled = true
          start.textContent = 'Starting…'
          api('/api/launch', { message: message, mode: modeS.value, domain: domS.value || 'none', repo: repoS.value })
            .then(function (r) {
              card.remove()
              var m = say('Started ' + state.profiles.agent + ' in ' + (r.worktreePath || r.name), 'hub')
              m.appendChild(el('div', 'meta', label(r.classification)))
              loadLaunches()
            })
            .catch(function (e) {
              start.disabled = cancel.disabled = false
              start.textContent = 'Start agent'
              say('Start failed: ' + e.message, 'hub', true)
            })
        })
        return post(card)
      }

      function whenLabel(iso) {
        var d = new Date(iso), now = new Date()
        var hm = d.toTimeString().slice(0, 5)
        return d.toDateString() === now.toDateString() ? hm : d.toISOString().slice(5, 10) + ' ' + hm
      }

      function renderLaunches() {
        var host = $('launches')
        host.innerHTML = ''
        if (!state.launches.length) { host.appendChild(el('div', 'empty', 'Nothing yet.')); return }
        state.launches.forEach(function (l) {
          var d = el('div', 'launch')
          d.title = 'Click to open this agent in ' + (l.backend || 'the tool')
          d.appendChild(el('div', 'title', l.message.length > 80 ? l.message.slice(0, 77) + '…' : l.message))
          d.appendChild(el('div', 'where', l.worktreePath || l.name))
          var tags = el('div', 'tags')
          tags.appendChild(el('span', 'tag', l.mode + (l.domain ? '/' + l.domain : '')))
          tags.appendChild(el('span', 'tag', l.repo))
          tags.appendChild(el('span', 'tag', whenLabel(l.at)))
          d.appendChild(tags)
          d.addEventListener('click', function () {
            d.classList.remove('err')
            api('/api/focus', { id: l.id }).catch(function (e) {
              d.classList.add('err')
              say('Could not open ' + l.name + ': ' + e.message, 'hub', true)
            })
          })
          host.appendChild(d)
        })
      }

      function loadLaunches() {
        return api('/api/launches').then(function (j) { state.launches = j.launches; renderLaunches() })
      }

      function setBusy(b) { state.busy = b; goEl.disabled = b; goEl.textContent = b ? 'Routing…' : 'Route' }

      $('compose').addEventListener('submit', function (e) {
        e.preventDefault()
        if (state.busy) return
        var message = textEl.value.trim()
        if (!message) return
        if (message.length > MAX_CHARS) { say('Message is over ' + MAX_CHARS + ' chars.', 'hub', true); return }
        say(message, 'me')
        setBusy(true)
        api('/api/route', { message: message, mode: state.mode, repo: repoEl.value })
          .then(function (r) { routeCard(message, r); textEl.value = ''; countEl.textContent = '' })
          .catch(function (err) { say('Routing failed: ' + err.message, 'hub', true) })
          .then(function () { setBusy(false) })
      })
      textEl.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); goEl.click() }
      })
      textEl.addEventListener('input', function () { countEl.textContent = textEl.value.length ? textEl.value.length + ' chars' : '' })
      $('modes').addEventListener('click', function (e) {
        var chip = e.target.closest('.chip'); if (!chip) return
        state.mode = chip.getAttribute('data-mode') || ''
        Array.prototype.forEach.call(document.querySelectorAll('#modes .chip'), function (c) { c.classList.toggle('on', c === chip) })
      })

      api('/api/profiles').then(function (p) {
        state.profiles = p
        $('health').textContent = 'connected'
        $('health').className = 'pill ok'
        Object.keys(p.modes).forEach(function (k) {
          var c = el('button', 'chip', k); c.type = 'button'; c.setAttribute('data-mode', k); $('modes').appendChild(c)
          var h = el('div')
          h.appendChild(el('b', '', k)); h.appendChild(el('span', 'd', p.modes[k].describe))
          Object.keys(p.modes[k].domains).forEach(function (d) {
            var dd = el('div', 'd', '· ' + d + ': ' + p.modes[k].domains[d]); dd.style.paddingLeft = '56px'; h.appendChild(dd)
          })
          $('modes-help').appendChild(h)
        })
        p.repos.forEach(function (r) { repoEl.appendChild(new Option('repo: ' + r.displayName, r.displayName)) })
        textEl.focus()
        loadLaunches().catch(function (e) { say('Could not load past launches: ' + e.message, 'hub', true) })
      }).catch(function (e) {
        $('health').textContent = 'server error'
        $('health').className = 'pill bad'
        say('Could not load profiles: ' + e.message, 'hub', true)
      })
    </script>
  </body>
</html>
