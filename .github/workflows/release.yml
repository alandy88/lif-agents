name: release

# Cuts a version tag whose commit carries both the built dist/ and the stamped
# version. Consumers pin these tags (`npm i -D github:alandy88/lif-sandcastle#vX.Y.Z`),
# so the tag — not main — is the installable artifact. The release commit is a
# child of main HEAD that exists only behind the tag ref; main itself stays
# clean and is deliberately NOT installable.
#
# The version is a property of the release, not of main. `package.json` on main
# reads `0.0.0-development` and is never bumped by a PR or by this workflow —
# only the release commit carries a real version. That is semantic-release's
# model, and it is what keeps a bot from ever having to push to a protected
# main. See README, "Why `dist/` ships in release tags".
#
# Release test: did `dist/` change? NOT: did a commit subject say `feat`. A
# subject is a claim about intent and `bb2f75a` proved it can be silent about a
# change every consumer feels; the built output cannot. Commit types still pick
# how big the bump is — see scripts/next-version.mts.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit tag, e.g. v0.3.0. Leave empty to derive from the commits."
        required: false

# Two merges seconds apart must not race for the same version or tag. Never
# cancel: a half-run release has already pushed a tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags and full log — the version is derived from both
      - uses: actions/setup-node@v4
        with:
          node-version: "24" # same floor as ci.yml (tests run off src/)

      - run: npm ci
      - run: npm run typecheck
      # Before the tests, not after: boundary.test.mts reads dist/*.d.mts. This
      # is also the artifact the release decision below is made against.
      - run: npm run build
      - run: npm test
      - run: npm run test:integration

      # Emits `last` (the newest release tag) and `changed` (would a consumer
      # installing the next tag receive anything different). Both decisions live
      # in the script, not here: they are about what real git does with real
      # refs and real pathspecs, and four rounds of review found seven bugs in
      # this step while it was shell no test could reach. The reasoning behind
      # each is in scripts/release-gate.mts; the integration tier drives them
      # against real temp repos.
      - name: is there anything to release?
        id: check
        run: node --experimental-strip-types scripts/release-gate.mts

      - name: decide the version
        id: version
        # An explicit dispatch releases even when dist/ is unchanged: naming a
        # version is a deliberate act (marking a milestone, re-cutting a tag),
        # and the artifact test exists to catch silence, not to overrule intent.
        # `stale` blocks the derived path but not the explicit one: an operator
        # naming a version has chosen the ref they dispatched, while a stale
        # push-event rerun has chosen nothing and would tag superseded code.
        if: steps.check.outputs.changed == 'true' || (inputs.version != '' && steps.check.outputs.stale != 'true')
        env:
          EXPLICIT: ${{ inputs.version }}
          LAST_TAG: ${{ steps.check.outputs.last }}
        run: node --experimental-strip-types scripts/next-version.mts

      - name: stamp and tag
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # --no-git-tag-version: npm writes package.json and package-lock.json
          # and touches git not at all. The commit below is this workflow's, and
          # it is never pushed to main — only the tag ref leaves this runner.
          npm version --no-git-tag-version "$VERSION"
          git add -f dist package.json package-lock.json
          git commit -m "release v$VERSION: stamp version, build dist/"
          git tag "v$VERSION"
          git push origin "refs/tags/v$VERSION"
          echo "Tagged [v$VERSION](https://github.com/${GITHUB_REPOSITORY}/releases/tag/v$VERSION)." >> "$GITHUB_STEP_SUMMARY"

      # Deliberately NOT gated on this run having cut a tag. Pushing a tag and
      # publishing its notes are two calls against different services, and a
      # transient failure between them is otherwise unrecoverable by rerunning:
      # the orphaned tag becomes the baseline, so the gate finds the payload
      # unchanged and skips, while an explicit re-dispatch of that same version
      # is rejected for not moving forward.
      #
      # Every release tag is checked, not just the newest, because the newest is
      # not necessarily the unpublished one: if vN's publish fails and a later
      # push cuts and publishes vN+1, vN is never the newest again and would
      # stay without notes forever. Reconciling the whole set converges from any
      # state, at one API call per tag.
      #
      # It reconciles rather than retries, so it also backfills tags cut before
      # this workflow existed. That is the intended state, arriving late.
      - name: publish notes for any unpublished tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # `--tags` so what counts as a release tag stays defined in exactly one
          # place, and so the tag this run just created is included.
          TAGS=$(node --experimental-strip-types scripts/release-gate.mts --tags)
          if [ -z "$TAGS" ]; then
            echo "No tags yet — nothing to publish."
            exit 0
          fi
          for TAG in $TAGS; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              continue
            fi
            # --verify-tag: fail rather than invent a tag if a push did not land.
            # --generate-notes gives consumers a diff summary at the tag, which
            # is the only place a pinning consumer looks.
            gh release create "$TAG" --verify-tag --generate-notes
            echo "Published notes for [$TAG](https://github.com/${GITHUB_REPOSITORY}/releases/tag/$TAG)." >> "$GITHUB_STEP_SUMMARY"
          done
