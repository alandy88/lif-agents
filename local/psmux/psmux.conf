# psmux -- terminal multiplexer. tmux-compatible config syntax.
# Loaded via the PSMUX_CONFIG_FILE env var (set by install.ps1), which wins
# over psmux's default search of ~/.psmux.conf, ~/.psmuxrc, ~/.tmux.conf.

# Prefix. C-b is left alone because Neovim uses it for page-up, and psmux
# swallows the prefix before the pane's application ever sees it.
set -g prefix C-a
unbind-key C-b
bind-key a send-prefix

# Ctrl+V. The Windows console host intercepts Ctrl+V and psmux reassembles it
# into a bracketed paste, which means Neovim never sees it as visual-block.
# Turning this off gives Ctrl+V back; paste is still Ctrl+Shift+V or prefix+].
# `unbind-key -n C-v` does NOT work here -- detection runs outside the binding
# system, so the option is the only lever.
set -g paste-detection off

# psmux defaults to pwsh already, so no default-shell line is needed. This is
# the one trap Zellij had -- its `default_shell` was unreliable and it fell
# back to cmd.exe, which is why the old profile wrapped it in a `z` function.
