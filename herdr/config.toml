onboarding = false
[terminal]
# Executable used for new interactive panes.
# Absolute path: bare "pwsh.exe" is fine on PATH, but an empty value falls back
# to powershell.exe (Windows PowerShell 5.1) rather than inheriting the parent shell.
default_shell = "C:/Program Files/PowerShell/7/pwsh.exe"

[ui]
agent_panel_sort = "priority"
