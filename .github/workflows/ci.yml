name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # dist/ ships to git-URL consumers, so a stale commit is a real defect.
      - name: dist/ is up to date
        run: git diff --exit-code -- dist
