<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --fg: var(--foreground, #ddd);
        --bg: var(--background, transparent);
        --muted: var(--muted-foreground, #999);
        --line: var(--border, #555);
        --card: var(--secondary, #2a2a2a);
        --accent: var(--primary, #4c8bf5);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        font: 13px/1.4 system-ui, sans-serif;
        color: var(--fg);
        background: var(--bg);
      }
      header {
        padding: 10px 12px 6px;
        border-bottom: 1px solid var(--line);
      }
      header h1 { font-size: 14px; margin: 0 0 4px; }
      header .sub { color: var(--muted); font-size: 12px; }
      header a { color: var(--accent); font-size: 12px; }
      #log {
        flex: 1;
        overflow-y: auto;
        padding: 10px 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .msg {
        max-width: 92%;
        padding: 7px 10px;
        border-radius: 10px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .me { align-self: flex-end; background: var(--accent); color: #fff; }
      .hub { align-self: flex-start; background: var(--card); border: 1px solid var(--line); }
      .hub.err { border-color: #c44; }
      .meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
      form {
        border-top: 1px solid var(--line);
        padding: 8px 12px 10px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
      .chips { display: flex; gap: 4px; flex-wrap: wrap; }
      .chip {
        padding: 2px 8px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--fg);
        cursor: pointer;
        font: inherit;
        font-size: 11px;
      }
      .chip.on { background: var(--accent); color: #fff; border-color: var(--accent); }
      textarea {
        width: 100%;
        min-height: 64px;
        resize: vertical;
        padding: 6px 8px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--card);
        color: var(--fg);
        font: inherit;
      }
      input#repo {
        flex: 1;
        min-width: 120px;
        padding: 5px 8px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--card);
        color: var(--fg);
        font: inherit;
      }
      button.go {
        padding: 5px 10px;
        border: 1px solid var(--accent);
        border-radius: 6px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        cursor: pointer;
      }
      button.go:disabled { opacity: 0.5; cursor: default; }
      label.small { font-size: 11px; color: var(--muted); display: flex; gap: 4px; align-items: center; }
      .spacer { flex: 1; }
      #count { font-size: 11px; color: var(--muted); }
    </style>
  </head>
  <body>
    <header>
      <h1>LIF Hub</h1>
      <div class="sub">Say what you want. It picks a mode and a repo, then starts an agent.</div>
      <div class="row" style="margin-top:6px"><a id="openpage" href="http://127.0.0.1:8765/#/hub" target="_blank" rel="noreferrer">Open the full hub bench</a></div>
    </header>

    <div id="log"></div>

    <form id="form">
      <div class="row">
        <span class="chips" id="modes">
          <button type="button" class="chip on" data-mode="">auto</button>
        </span>
      </div>
      <div class="row">
        <input id="repo" list="repos" placeholder="repo (blank = auto)" />
        <datalist id="repos"></datalist>
      </div>
      <textarea id="text" placeholder="e.g. plan a Bicep module for the gateway's rate limiter"></textarea>
      <div class="row">
        <label class="small"><input type="checkbox" id="dry" /> dry run</label>
        <span class="spacer"></span>
        <span id="count"></span>
        <button type="submit" class="go" id="go">Start agent</button>
      </div>
    </form>

    <script>
      'use strict'
      // The hub lives in workbench-lite; every launch is one POST to it.
      var HUB = 'http://127.0.0.1:8765/hub'
      var MAX_MESSAGE_CHARS = 4096
      var FALLBACK_MODES = ['explore', 'plan', 'exec', 'verify', 'deploy']

      var logEl = document.getElementById('log')
      var textEl = document.getElementById('text')
      var repoEl = document.getElementById('repo')
      var dryEl = document.getElementById('dry')
      var goEl = document.getElementById('go')
      var countEl = document.getElementById('count')
      var mode = ''

      function say(text, who, err) {
        var div = document.createElement('div')
        div.className = 'msg ' + who + (err ? ' err' : '')
        div.textContent = text
        logEl.appendChild(div)
        logEl.scrollTop = logEl.scrollHeight
        return div
      }

      function api(path, body) {
        var opts = body ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) } : {}
        return fetch(HUB + path, opts).then(function (r) {
          return r.text().then(function (t) {
            var j = null
            try { j = JSON.parse(t) } catch (e) { j = null }
            if (!r.ok) throw new Error((j && j.detail) || t || ('HTTP ' + r.status))
            return j
          })
        }, function () {
          throw new Error('Workbench did not answer from this panel (origin ' + location.origin + '). Is workbench-lite running on 127.0.0.1:8765? If it is, add this origin to WB_HUB_ALLOW_ORIGINS in apps/workbench-lite/.env and restart the service.')
        })
      }

      function label(c) { return c.mode + (c.domain ? '/' + c.domain : '') + ' → ' + c.repo }

      function addMode(key) {
        var c = document.createElement('button')
        c.type = 'button'; c.className = 'chip'; c.textContent = key; c.setAttribute('data-mode', key)
        document.getElementById('modes').appendChild(c)
      }
      function addRepo(name) {
        var o = document.createElement('option')
        o.value = name
        document.getElementById('repos').appendChild(o)
      }

      api('/profiles').then(function (p) {
        Object.keys(p.modes).forEach(addMode)
        p.repos.forEach(function (r) { addRepo(r.displayName) })
        if (p.warnings && p.warnings.length) say(p.warnings.join('\n'), 'hub', true)
      }).catch(function (e) {
        FALLBACK_MODES.forEach(addMode)
        say(e.message, 'hub', true)
      })

      document.getElementById('modes').addEventListener('click', function (e) {
        var chip = e.target.closest('.chip')
        if (!chip) return
        mode = chip.getAttribute('data-mode') || ''
        Array.prototype.forEach.call(document.querySelectorAll('#modes .chip'), function (c) {
          c.classList.toggle('on', c === chip)
        })
      })
      textEl.addEventListener('input', function () {
        var n = textEl.value.length
        countEl.textContent = n > MAX_MESSAGE_CHARS ? n + ' / ' + MAX_MESSAGE_CHARS + ' too long' : n ? n + ' chars' : ''
      })
      textEl.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) {
          e.preventDefault()
          goEl.click()
        }
      })

      document.getElementById('form').addEventListener('submit', function (e) {
        e.preventDefault()
        var message = textEl.value.trim()
        if (!message) return
        if (message.length > MAX_MESSAGE_CHARS) { say('Message is over ' + MAX_MESSAGE_CHARS + ' chars. Shorten it.', 'hub', true); return }
        var body = { message: message, mode: mode, repo: repoEl.value.trim() }
        var dry = dryEl.checked
        say(message, 'me')
        goEl.disabled = true
        goEl.textContent = dry ? 'Routing…' : 'Starting…'
        api(dry ? '/route' : '/launch', body).then(function (r) {
          var m = say(dry ? 'Would route as ' + label(r.classification) + ' (worktree ' + r.name + '). Nothing started.' : 'Started the agent in ' + (r.worktreePath || r.name), 'hub')
          var meta = document.createElement('div')
          meta.className = 'meta'
          meta.textContent = label(r.classification) + (dry ? ' · ' + r.prompt.length + '-char prompt' : '')
          m.appendChild(meta)
          textEl.value = ''
          countEl.textContent = ''
        }).catch(function (err) {
          say((dry ? 'Routing failed: ' : 'Start failed: ') + err.message, 'hub', true)
        }).then(function () {
          goEl.disabled = false
          goEl.textContent = 'Start agent'
        })
      })
    </script>
  </body>
</html>
