"$schema" = 'https://starship.rs/config-schema.json'

# Catppuccin Mocha. This palette is the shared one across the whole stack --
# wezterm/wezterm.lua sets color_scheme = 'Catppuccin Mocha' to match. Changing
# one without the other leaves the prompt fighting the terminal background.
#
# Segment order and their backgrounds:
#   red -> peach -> yellow -> green -> sapphire -> lavender
#   os/user  dir    git      langs    tooling     time

format = """
[](red)\
$os\
$username\
$hostname\
$container\
$shlvl\
[](bg:peach fg:red)\
$directory\
[](bg:yellow fg:peach)\
$git_branch\
$git_status\
$git_metrics\
[](fg:yellow bg:green)\
$c\
$cpp\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:green bg:sapphire)\
$docker_context\
$conda\
$pixi\
[](fg:sapphire bg:lavender)\
$time\
[ ](fg:lavender)\
$cmd_duration\
$status\
$sudo\
$line_break\
$character"""

palette = 'catppuccin_mocha'

# Keep a slow module from stalling the prompt. scan_timeout bounds the
# filesystem probe each language module does on every directory change.
command_timeout = 1000
scan_timeout = 35

[os]
disabled = false
style = "bg:red fg:crust"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[username]
show_always = true
style_user = "bg:red fg:crust"
style_root = "bg:red fg:crust"
format = '[ $user]($style)'

# Which box am I on. ssh_only keeps this invisible on the local workstation and
# present the moment a session is remote -- the three homelab hosts otherwise
# render an identical prompt.
[hostname]
ssh_only = true
style = "bg:red fg:crust"
format = '[@$hostname]($style)'

# Inside an Incus/Docker container rather than on the host.
[container]
style = "bg:red fg:crust"
format = '[ $symbol]($style)'

# Nested shells: SSH -> multiplexer -> subshell stacks up silently otherwise.
[shlvl]
disabled = false
threshold = 2
repeat = false
symbol = "≡"
style = "bg:red fg:crust"
format = '[ $symbol$shlvl]($style)'

[directory]
style = "bg:peach fg:crust"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:yellow"
format = '[[ $symbol $branch ](fg:crust bg:yellow)]($style)'

[git_status]
style = "bg:yellow"
format = '[[($all_status$ahead_behind )](fg:crust bg:yellow)]($style)'

[git_metrics]
disabled = false
added_style = "bg:yellow fg:crust"
deleted_style = "bg:yellow fg:maroon"
format = '[[(+$added)](fg:crust bg:yellow)]($added_style)[[(-$deleted) ](fg:maroon bg:yellow)]($deleted_style)'

[nodejs]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[c]
symbol = " "
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[cpp]
symbol = " "
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[rust]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[golang]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[php]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[java]
symbol = " "
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[kotlin]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[haskell]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[python]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version)(\(#$virtualenv\)) ](fg:crust bg:green)]($style)'

[docker_context]
symbol = ""
style = "bg:sapphire"
format = '[[ $symbol( $context) ](fg:crust bg:sapphire)]($style)'

[conda]
symbol = "  "
style = "fg:crust bg:sapphire"
format = '[$symbol$environment ]($style)'
ignore_base = false

[pixi]
style = "bg:sapphire"
format = '[[ $symbol( $version)( $environment) ](fg:crust bg:sapphire)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:lavender"
format = '[[  $time ](fg:crust bg:lavender)]($style)'

# Single-line prompt: the character sits on the same row as the segments.
[line_break]
disabled = true

[character]
disabled = false
success_symbol = '[❯](bold fg:green)'
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:green)'
vimcmd_replace_one_symbol = '[❮](bold fg:lavender)'
vimcmd_replace_symbol = '[❮](bold fg:lavender)'
vimcmd_visual_symbol = '[❮](bold fg:yellow)'

# Desktop notification when a long command finally lands. Harmless where the
# platform has no notifier -- starship just skips it.
[cmd_duration]
show_milliseconds = true
format = " in $duration "
style = "bg:lavender"
disabled = false
show_notifications = false
min_time_to_notify = 45000

# The character arrow already turns red on failure; this adds the actual code,
# which is the part you need when a command dies at 127 vs 130 vs 1.
[status]
disabled = false
symbol = "✘"
format = '[$symbol$status]($style) '
style = "bold fg:red"

# Marks a still-valid sudo timestamp -- this host is "hot" until it expires.
[sudo]
disabled = false
symbol = "!"
format = '[$symbol]($style) '
style = "bold fg:maroon"

